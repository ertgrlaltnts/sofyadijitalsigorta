# Sofya Dijital Sigorta: nginx ayarı (web 4001, admin 4002, api 4000).
#
# Kurulum (sunucuda başka siteler nginx ile çalışıyorsa 80 portu doludur; nginx'i durdurmadan webroot yöntemi kullanılır):
#   1. DNS'te sofyadijitalsigorta.com, www, apisf ve pnlsf kayıtları bu sunucuyu göstersin.
#   2. Geçici, yalnızca 80 portunu dinleyen bir ayar ile doğrulama klasörünü açın:
#        sudo mkdir -p /var/www/certbot
#        sudo tee /etc/nginx/conf.d/sofya-acme.conf >/dev/null <<'CONF'
#        server {
#            listen 80;
#            server_name sofyadijitalsigorta.com www.sofyadijitalsigorta.com apisf.sofyadijitalsigorta.com pnlsf.sofyadijitalsigorta.com;
#            location /.well-known/acme-challenge/ { root /var/www/certbot; }
#            location / { return 404; }
#        }
#        CONF
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Sertifikayı alın:
#        sudo certbot certonly --webroot -w /var/www/certbot -d sofyadijitalsigorta.com -d www.sofyadijitalsigorta.com -d apisf.sofyadijitalsigorta.com -d pnlsf.sofyadijitalsigorta.com
#   4. Geçici ayarı silin ve bu dosyayı kullanın:
#        sudo rm /etc/nginx/conf.d/sofya-acme.conf
#        sudo cp nginx-sofya.conf /etc/nginx/conf.d/sofya.conf
#        sudo nginx -t && sudo systemctl reload nginx
#      Yenileme otomatiktir (certbot renew); aşağıdaki 80 portu bloğu doğrulama yolunu açık tutar.
#
# Not: Sertifika adı, certbot'a verdiğiniz ilk alan adıdır (sofyadijitalsigorta.com). Başka bir adla aldıysanız
# aşağıdaki iki ssl_certificate satırını ona göre değiştirin.

# --- 80 -> 443 (dört alan adı için tek blok) ---
server {
    listen 80;
    listen [::]:80;
    server_name sofyadijitalsigorta.com www.sofyadijitalsigorta.com apisf.sofyadijitalsigorta.com pnlsf.sofyadijitalsigorta.com;

    # Sertifika yenilemesi için
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# --- sofyadijitalsigorta.com -> www (sitenin canonical adresi www) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sofyadijitalsigorta.com;

    ssl_certificate /etc/letsencrypt/live/sofyadijitalsigorta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofyadijitalsigorta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.sofyadijitalsigorta.com$request_uri;
}

# --- Web sitesi (Next.js, 4001) ---
# Güvenlik başlıklarını (HSTS dahil) Next.js uygulaması kendisi ekler; burada tekrarlanmaz.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sofyadijitalsigorta.com;

    ssl_certificate /etc/letsencrypt/live/sofyadijitalsigorta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofyadijitalsigorta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Yönetim paneli (Next.js, 4002) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pnlsf.sofyadijitalsigorta.com;

    ssl_certificate /etc/letsencrypt/live/sofyadijitalsigorta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofyadijitalsigorta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin" always;

    # İsteğe bağlı: paneli yalnızca belirli IP'lere açın.
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (NestJS, 4000) ---
# Helmet güvenlik başlıklarını API kendisi ekler. Sofya'nın yanıtı SSE ile aktığı için tamponlama kapalıdır.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apisf.sofyadijitalsigorta.com;

    ssl_certificate /etc/letsencrypt/live/sofyadijitalsigorta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofyadijitalsigorta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
